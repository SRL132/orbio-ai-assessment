name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      TEST_DATABASE_URL: postgresql+psycopg://sazon:sazon@localhost:5432/sazon_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sazon
          POSTGRES_PASSWORD: sazon
          POSTGRES_DB: sazon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sazon" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint and format
        run: uv run ruff format --check . && uv run ruff check .
      - name: Types
        run: uv run mypy app
      - name: Architecture boundaries
        run: uv run lint-imports
      - name: Tests and coverage ratchet
        run: uv run pytest --cov
      - name: Offline evals vs baseline
        run: uv run python -m evals --check
      - name: Mutation testing (qualification rules)
        run: uv run mutmut run && uv run python -m tests.mutation_check
      - name: Dependency hygiene
        run: uv run deptry . && uv run pip-audit
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag sazon-screening:ci .

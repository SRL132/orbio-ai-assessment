# Local monitoring stack: docker compose --profile monitoring up --build
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: web
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["app:8000"]
  # Every worker replica: docker compose --scale worker=3 needs no change here.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

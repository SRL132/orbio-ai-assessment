# docker run --rm -v "$PWD/monitoring:/m" --workdir /m --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'sazon_pending_messages_oldest_seconds'
        values: '10 10 90 90 90 90'
      - series: 'sazon_turns_held_total{outcome="gave_up"}'
        values: '0 0 0 1 1 1'
      - series: 'up{job="worker",instance="w1"}'
        values: '1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoWorkers
        exp_alerts: []
      - eval_time: 1m
        alertname: MessagesWaiting
        exp_alerts: []
      - eval_time: 5m
        alertname: MessagesWaiting
        exp_alerts:
          - exp_annotations:
              summary: "The oldest unprocessed message has waited over 60 s"
            exp_labels: {severity: page}
      - eval_time: 4m
        alertname: TurnsGaveUp
        exp_alerts:
          - exp_annotations:
              summary: "Retries ran out for a candidate's message"
            exp_labels: {severity: page}
      - eval_time: 5m
        alertname: ProcessDown
        exp_alerts:
          - exp_annotations:
              summary: "worker at w1 can't be scraped"
            exp_labels: {severity: page, job: worker, instance: w1}
  - interval: 1m
    input_series:
      - series: 'up{job="web",instance="a"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: NoWorkers
        exp_alerts:
          - exp_annotations:
              summary: "No worker process is running: nothing answers candidates"
            exp_labels: {severity: page, job: worker}

  # p95 between the 8 s and 16 s buckets: fires only after 10 minutes.
  - interval: 1m
    input_series:
      - series: 'sazon_turn_seconds_bucket{channel="chat",le="8"}'
        values: '0x40'
      - series: 'sazon_turn_seconds_bucket{channel="chat",le="16"}'
        values: '0+10x40'
      - series: 'sazon_turn_seconds_bucket{channel="chat",le="+Inf"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: SlowTurns
        exp_alerts: []
      - eval_time: 30m
        alertname: SlowTurns
        exp_alerts:
          - exp_annotations:
              summary: "p95 turn time is above 8 s: candidates are waiting"
            exp_labels: {severity: page}
  - interval: 1m
    input_series:
      - series: 'sazon_turn_seconds_bucket{channel="chat",le="8"}'
        values: '0+10x40'
      - series: 'sazon_turn_seconds_bucket{channel="chat",le="16"}'
        values: '0+10x40'
      - series: 'sazon_turn_seconds_bucket{channel="chat",le="+Inf"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: SlowTurns
        exp_alerts: []

  # 10% of calls fail, then 1%.
  - interval: 1m
    input_series:
      - series: 'sazon_events_total{type="extractor_failed"}'
        values: '0+1x40'
      - series: 'sazon_llm_calls_total{provider="p",kind="extract"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighFallbackRate
        exp_alerts:
          - exp_annotations:
              summary: "More than 5% of LLM calls fail or fall back to a template"
            exp_labels: {severity: ticket}
  - interval: 1m
    input_series:
      - series: 'sazon_events_total{type="reply_rejected"}'
        values: '0+1x40'
      - series: 'sazon_llm_calls_total{provider="p",kind="extract"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighFallbackRate
        exp_alerts: []

  # Held turns keep coming, then a held count that stopped rising.
  - interval: 1m
    input_series:
      - series: 'sazon_turns_held_total{outcome="held"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TurnsHeld
        exp_alerts:
          - exp_annotations:
              summary: "No LLM is answering: candidates' messages are held for a retry"
            exp_labels: {severity: page}
  - interval: 1m
    input_series:
      - series: 'sazon_turns_held_total{outcome="held"}'
        values: '5x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: TurnsHeld
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'sazon_review_queue_oldest_seconds'
        values: '200000x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: ReviewQueueOld
        exp_alerts:
          - exp_annotations:
              summary: "A candidate has waited for review over 2 days (calendar days, not working days)"
            exp_labels: {severity: ticket}
  - interval: 1m
    input_series:
      - series: 'sazon_review_queue_oldest_seconds'
        values: '100000x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: ReviewQueueOld
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'sazon_whatsapp_outbox_oldest_seconds'
        values: '4000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OutboxStuck
        exp_alerts:
          - exp_annotations:
              summary: "A WhatsApp message has been undelivered for over 1 h"
            exp_labels: {severity: ticket}
  - interval: 1m
    input_series:
      - series: 'sazon_whatsapp_outbox_oldest_seconds'
        values: '100x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OutboxStuck
        exp_alerts: []

  # $0.05 a conversation, then $0.02 (the limit is $0.032).
  - interval: 5m
    input_series:
      - series: 'sazon_conversation_cost_usd_sum{status="qualified"}'
        values: '0+0.05x40'
      - series: 'sazon_conversation_cost_usd_count{status="qualified"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 3h
        alertname: CostPerConversationHigh
        exp_alerts:
          - exp_annotations:
              summary: "A conversation costs over 2x the measured $0.016"
            exp_labels: {severity: ticket}
  - interval: 5m
    input_series:
      - series: 'sazon_conversation_cost_usd_sum{status="qualified"}'
        values: '0+0.02x40'
      - series: 'sazon_conversation_cost_usd_count{status="qualified"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 3h
        alertname: CostPerConversationHigh
        exp_alerts: []

  # Week 1: 90% complete. Week 2: 50%, so it fires. Then the same 90% both weeks, so it doesn't.
  - interval: 5m
    input_series:
      - series: 'sazon_outcomes_total{status="qualified"}'
        values: '0+9x2016 18144+5x2020'
      - series: 'sazon_outcomes_total{status="abandoned"}'
        values: '0+1x2016 2016+5x2020'
    alert_rule_test:
      - eval_time: 14d
        alertname: CompletionDropped
        exp_alerts:
          - exp_annotations:
              summary: "Completion fell over 20% week on week"
            exp_labels: {severity: ticket}
  - interval: 5m
    input_series:
      - series: 'sazon_outcomes_total{status="qualified"}'
        values: '0+9x4040'
      - series: 'sazon_outcomes_total{status="abandoned"}'
        values: '0+1x4040'
    alert_rule_test:
      - eval_time: 14d
        alertname: CompletionDropped
        exp_alerts: []

# Provider comparison (docs/architecture.md → LLM provider → Selection process).
# Run: uv run python -m evals.compare            (needs OPENROUTER_API_KEY in .env; costs money)
#      uv run python -m evals.compare --check-models   (free: only checks the model ids exist)
# Model ids are checked against your account's live OpenRouter model list before anything runs.
# First pass: one scripted run per shortlisted model, each capped at its share of the budget.
# Models over the 5 s median get no repeats.

budget_usd: 25.0
# One cheap model plays the candidate in every simulated run, so all models face the same people.
simulator_model: qwen/qwen3.8-flash
simulator_reasoning: none

runs:
  - {name: Gemini 3.5 Flash-Lite, model: google/gemini-3.5-flash-lite, reasoning: low}
  - {name: Gemini 3.8 Flash, model: google/gemini-3.8-flash, reasoning: low}
  - {name: Claude Haiku 5.5, model: anthropic/claude-haiku-5.5, reasoning: low}
  - {name: Claude Sonnet 5.5, model: anthropic/claude-sonnet-5.5, reasoning: low}
  - {name: GPT-5.6 Terra, model: openai/gpt-5.6-terra, reasoning: low}

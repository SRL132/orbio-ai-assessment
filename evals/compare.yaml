# Provider comparison (docs/architecture.md → LLM provider → Selection process).
# Run: uv run python -m evals.compare            (needs OPENROUTER_API_KEY in .env; costs money)
#      uv run python -m evals.compare --check-models   (free: only checks the model ids exist)
# Model ids are checked against your account's live OpenRouter model list before anything runs.
# Third pass: LLM-simulated candidates, the harder test. Sonnet is left out: it costs 3.6x Terra
# per conversation without beating it on the scripted runs.

budget_usd: 6.5
# One cheap model plays the candidate in every simulated run, so all models face the same people.
# Not Qwen: it hit OpenRouter rate limits (429) with several runs side by side.
simulator_model: google/gemini-3.5-flash-lite
simulator_reasoning: minimal

runs:
  - {name: Gemini 3.5 Flash-Lite (simulated), model: google/gemini-3.5-flash-lite, simulate: true, reasoning: low, cap_usd: 1.5}
  - {name: Gemini 3.8 Flash (simulated), model: google/gemini-3.8-flash, simulate: true, reasoning: low, cap_usd: 2.5}
  - {name: Claude Haiku 5.5 (simulated), model: anthropic/claude-haiku-5.5, simulate: true, reasoning: low, cap_usd: 1.5}

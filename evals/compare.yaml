# Provider comparison (docs/architecture.md → LLM provider → Selection process).
# Run: uv run python -m evals.compare            (needs OPENROUTER_API_KEY in .env; costs money)
#      uv run python -m evals.compare --check-models   (free: only checks the model ids exist)
# Model ids are checked against your account's live OpenRouter model list before anything runs.
#
# 2026-10-30: this OpenRouter account is restricted from closed-weight models (Anthropic, Google,
# OpenAI), so this matrix uses open-weight families. The original shortlist (Claude Sonnet 5.5,
# Gemini 3.8 Flash, GPT-5.6 Terra + small models) runs once the restriction is lifted.

budget_usd: 5.0
# One cheap model plays the candidate in every simulated run, so all models face the same people.
simulator_model: qwen/qwen3.8-flash
simulator_reasoning: none

# reasoning: OpenRouter effort per run, chosen from a probe (2026-10-30): the lowest level that
# still answered correctly. Mistral Large requires reasoning; DeepSeek Pro misses at "none".

runs:
  # Mid tier, one per family: extraction and replies.
  - {name: DeepSeek V4 Pro, model: deepseek/deepseek-v4-pro, reasoning: low}
  - {name: Qwen 3.7 Plus, model: qwen/qwen3.7-plus, reasoning: none}
  - {name: Mistral Large 4 (EU), model: mistralai/mistral-large-4-0, reasoning: low}
  # Small models for extraction only; the family's mid-tier model writes replies.
  - {name: DeepSeek V4.1 Flash extract, model: deepseek/deepseek-v4.1-flash, responder_model: deepseek/deepseek-v4-pro, reasoning: low}
  - {name: Qwen 3.8 Flash extract, model: qwen/qwen3.8-flash, responder_model: qwen/qwen3.7-plus, reasoning: none}
  - {name: Mistral Small extract, model: mistralai/mistral-small-2603, responder_model: mistralai/mistral-large-4-0, reasoning: low}
  # The same mid-tier models against LLM-simulated candidates (harder, less predictable).
  - {name: DeepSeek V4 Pro (simulated), model: deepseek/deepseek-v4-pro, simulate: true, reasoning: low}
  - {name: Qwen 3.7 Plus (simulated), model: qwen/qwen3.7-plus, simulate: true, reasoning: none}
  - {name: Mistral Large 4 (simulated), model: mistralai/mistral-large-4-0, simulate: true, reasoning: low}

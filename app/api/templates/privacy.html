<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ "Privacy notice" if lang == "en" else "Aviso de privacidad" }} · {{ company }}</title>
  <style>
    body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#f9fafb; margin:0; padding:24px; color:#111827; }
    main { max-width:560px; margin:0 auto; background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:24px; line-height:1.5; }
    h1 { font-size:18px; margin:0 0 12px; color:#c2410c; }
  </style>
</head>
<body>
<main>
  <h1>{{ "Privacy notice" if lang == "en" else "Aviso de privacidad" }} · {{ company }}</h1>
  <p>{{ notice }}</p>
</main>
</body>
</html>

# Local production-like stack: a web process, a worker process and Postgres.
#   docker compose up --build      → http://localhost:8000/chat, /voice, /dashboard
#   docker compose up --scale worker=3   (any number of workers: leases keep them apart)
# Settings (LLM provider, keys, recruiter accounts) come from .env if present. This is the demo
# stack: without .env it runs offline, not on the production LLMs the image defaults to.
#   docker compose --profile monitoring up --build   → adds Prometheus (:9090) and Alertmanager (:9093)

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sazon
      POSTGRES_DB: sazon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sazon-local-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sazon -d sazon"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sazon:${POSTGRES_PASSWORD:-sazon-local-dev}@db:5432/sazon
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      ROLE: web
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]  # the app container has run the migrations
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sazon:${POSTGRES_PASSWORD:-sazon-local-dev}@db:5432/sazon
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      METRICS_PORT: 9100  # reachable only on the compose network
    healthcheck:
      disable: true  # only serves metrics
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    # METRICS_TOKEN comes from .env; Prometheus reads a bearer token only from a file.
    entrypoint:
      - sh
      - -c
      - >-
        printf %s "$$METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
    env_file:
      - path: .env
        required: false
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  pgdata:
  prometheus:
